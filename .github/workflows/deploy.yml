name: Déploiement VPS (production)

# Se déclenche à chaque push sur main (ou manuellement depuis l'onglet Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : on ne veut pas deux mises à jour simultanées.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer sur le VPS Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Connexion SSH + déploiement
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          # Secrets transmis au serveur. Tous facultatifs : si le secret n'existe
          # pas dans GitHub, l'étape correspondante est simplement ignorée.
          #   FCM_SA_B64   : compte de service Firebase (notifications push), base64
          #   MAIL_*       : identifiants SMTP du fournisseur d'e-mails
          envs: FCM_SA_B64,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,MAIL_SCHEME,MAIL_FROM_ADDRESS,MAIL_FROM_NAME
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            echo "==> Récupération du code depuis GitHub"
            git fetch origin main
            git reset --hard origin/main
            # Installer le compte de service Firebase (push) si le secret est fourni.
            if [ -n "${FCM_SA_B64:-}" ]; then
              echo "==> Installation du compte de service Firebase (push)"
              mkdir -p storage/app/firebase
              echo "$FCM_SA_B64" | base64 -d > storage/app/firebase/service-account.json
              chmod 600 storage/app/firebase/service-account.json
            fi
            chmod +x scripts/set-env.sh
            # Fournisseur d'e-mails : renseigné depuis les secrets GitHub, ce qui
            # permet d'en changer sans aucun accès SSH. La boîte de l'hébergeur
            # est plafonnée à 1 000 envois par jour et finit en indésirable ;
            # un service d'envoi dédié (Brevo, Resend, Mailgun…) règle les deux.
            if [ -n "${MAIL_HOST:-}" ]; then
              echo "==> Configuration du fournisseur d'e-mails ($MAIL_HOST)"
              ./scripts/set-env.sh MAIL_MAILER smtp
              ./scripts/set-env.sh MAIL_HOST "$MAIL_HOST"
              [ -n "${MAIL_PORT:-}" ] && ./scripts/set-env.sh MAIL_PORT "$MAIL_PORT"
              [ -n "${MAIL_USERNAME:-}" ] && ./scripts/set-env.sh MAIL_USERNAME "$MAIL_USERNAME"
              [ -n "${MAIL_PASSWORD:-}" ] && ./scripts/set-env.sh MAIL_PASSWORD "$MAIL_PASSWORD"
              [ -n "${MAIL_SCHEME:-}" ] && ./scripts/set-env.sh MAIL_SCHEME "$MAIL_SCHEME"
              [ -n "${MAIL_FROM_ADDRESS:-}" ] && ./scripts/set-env.sh MAIL_FROM_ADDRESS "$MAIL_FROM_ADDRESS"
              [ -n "${MAIL_FROM_NAME:-}" ] && ./scripts/set-env.sh MAIL_FROM_NAME "$MAIL_FROM_NAME"
            fi
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
        env:
          FCM_SA_B64: ${{ secrets.FCM_SERVICE_ACCOUNT_B64 }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SCHEME: ${{ secrets.MAIL_SCHEME }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
