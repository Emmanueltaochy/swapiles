# Codemagic — build de l'app mobile Swap'Îles (Capacitor, dossier /mobile).
# L'app charge le site en direct (https://swapiles.com) : ce workflow ne fait
# que produire les binaires iOS/Android et les publier.
#
# ⚙️  À CONFIGURER une fois dans l'interface Codemagic (Teams > Integrations /
#     Code signing / Environment variables) :
#   - iOS  : intégration « App Store Connect » (clé API) → signature automatique.
#   - Android : keystore uploadé sous la référence  swapiles_keystore
#               + groupe de variables  google_play  contenant
#               GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (compte de service Play).
#
# Le premier build mobile demande souvent 1–2 ajustements : lance-le, et
# colle-moi l'erreur éventuelle, on corrige ensemble.

workflows:

  # ---------------------------------------------------------------------------
  # ANDROID — MODE VALIDATION (APK debug, NON signé)
  # Ne nécessite ni keystore ni compte Play : sert à vérifier que tout le
  # pipeline compile. On passe en release signé + publication Play une fois les
  # comptes prêts (voir workflow "android-release" plus bas, à activer).
  # ---------------------------------------------------------------------------
  android:
    name: Swap'Îles Android (validation)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.swapiles.app"
      node: 20
    scripts:
      - name: Utiliser JDK 21 (requis par Capacitor 7)
        script: |
          echo "JDK disponibles :"; /usr/libexec/java_home -V 2>&1 || true
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          echo "JAVA_HOME=$JAVA_HOME" >> $CM_ENV
          "$JAVA_HOME/bin/java" -version
      - name: Installer les dépendances
        script: |
          cd mobile
          npm install
      - name: Générer le projet Android + icônes
        script: |
          cd mobile
          npx cap add android || true
          npx @capacitor/assets generate --android --assetPath resources || true
          npx cap sync android
      - name: Configurer Firebase (notifications push)
        script: |
          cd mobile
          # Le projet Android est régénéré à chaque build : on (re)pose la config
          # Firebase et on branche le plug-in google-services.
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            python3 - <<'PY'
          import re, pathlib
          # build.gradle projet : classpath du plug-in google-services
          p = pathlib.Path('android/build.gradle'); g = p.read_text()
          if 'com.google.gms:google-services' not in g:
              g = re.sub(r"(classpath 'com\.android\.tools\.build:gradle[^\n]*\n)",
                         r"\1        classpath 'com.google.gms:google-services:4.4.2'\n", g, count=1)
              p.write_text(g)
          # build.gradle app : appliquer le plug-in
          p = pathlib.Path('android/app/build.gradle'); a = p.read_text()
          if 'com.google.gms.google-services' not in a:
              a = a.rstrip() + "\napply plugin: 'com.google.gms.google-services'\n"
              p.write_text(a)
          print('Firebase branché (google-services)')
          PY
          else
            echo "google-services.json absent : build sans push (normal si non configuré)"
          fi
      - name: Cibler l'API 36 (exigence Google Play)
        script: |
          cd mobile
          yes | sdkmanager "platforms;android-36" >/dev/null 2>&1 || true
          python3 scripts/target-sdk-36.py
      - name: Build APK debug (non signé)
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          cd mobile/android
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"
    artifacts:
      - mobile/android/app/build/outputs/**/*.apk

  # ---------------------------------------------------------------------------
  # iOS → TestFlight (App Store Connect)
  # ---------------------------------------------------------------------------
  ios:
    name: Swap'Îles iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic          # nom de ta clé API dans Codemagic (UI)
    environment:
      # Le groupe ios_credentials (Codemagic UI > App settings > Environment
      # variables) contient CERTIFICATE_PRIVATE_KEY : la clé privée avec laquelle
      # Codemagic crée le certificat de distribution Apple. Sans elle, aucun
      # certificat ni profil ne peut être créé.
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: "com.swapiles.app"
        # Version affichée sur l'App Store. Le numéro de build, lui, est repris
        # du compteur Codemagic à chaque lancement (voir l'étape Info.plist).
        MARKETING_VERSION: "1.0"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installer les dépendances
        script: |
          cd mobile
          npm install
      - name: Générer le projet iOS + icônes
        script: |
          cd mobile
          npx cap add ios || true
          npx @capacitor/assets generate --ios --assetPath resources || true
          npx cap sync ios
      - name: Fond de l'écran de lancement (évite le carré sur fond noir)
        script: |
          cd mobile
          python3 scripts/ios-splash-background.py
      - name: Installer les pods
        script: |
          cd mobile/ios/App
          pod install
      - name: Déclarations Info.plist (chiffrement, accès photo, numéro de build)
        script: |
          PLIST=mobile/ios/App/App/Info.plist

          # L'app n'utilise que le HTTPS fourni par iOS : elle est exemptée des
          # règles d'exportation. On le déclare dans Info.plist pour ne plus avoir
          # à répondre au questionnaire à chaque envoi sur App Store Connect.
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

          # AUTORISATIONS PHOTO — indispensables, leur absence FAIT PLANTER l'app.
          #
          # Le dépôt d'annonce utilise un champ fichier standard. Sur iOS, le
          # menu propose « Prendre une photo » et « Photothèque ». iOS arrête
          # IMMÉDIATEMENT toute app qui accède à l'appareil photo ou aux photos
          # sans avoir déclaré le motif dans Info.plist. C'est la cause du
          # plantage relevé par Apple (refus 2.1(a), « tap on take photo »).
          #
          # Ces clés ne sont pas fournies par le modèle Capacitor : sans plug-in
          # natif photo, il faut les poser nous-mêmes. Les libellés sont écrits
          # SANS apostrophe : PlistBuddy analyse lui-même la chaîne reçue et
          # l'échappement des apostrophes ne lui survit pas.
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Swap Iles utilise votre appareil photo pour vous permettre de photographier les articles que vous mettez en vente." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Swap Iles accede a vos photos pour vous permettre de choisir les images de vos annonces." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryAddUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Swap Iles enregistre une image dans vos photos lorsque vous le demandez." "$PLIST"

          # NUMÉRO DE BUILD UNIQUE ET CROISSANT.
          #
          # Le projet iOS est régénéré à chaque build (npx cap add ios) : sans
          # cette étape il repart à 1 à chaque fois, et App Store Connect refuse
          # tout envoi dont le numéro a déjà servi. On reprend le compteur de
          # builds Codemagic, qui ne fait qu'augmenter.
          BN="${PROJECT_BUILD_NUMBER:-$(date +%s)}"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleVersion" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BN" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleShortVersionString" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${MARKETING_VERSION:-1.0}" "$PLIST"

          echo "=== Déclarations posées ==="
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST"
          echo "Version : $(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST") (build $(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"))"
      - name: Signature (certificat + profil App Store créés automatiquement)
        script: |
          set -e
          keychain initialize
          # Crée le certificat de distribution (avec CERTIFICATE_PRIVATE_KEY) et
          # le profil App Store pour le bundle, puis les installe et les applique.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          echo "=== Profils téléchargés ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cd mobile/ios/App
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd mobile/ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ---------------------------------------------------------------------------
  # ANDROID — AAB SIGNÉ (upload manuel sur Play)
  # Prérequis Codemagic (UI) : keystore réf. swapiles_keystore (généré dans
  # Codemagic). Produit un .aab signé à télécharger, puis à uploader à la main
  # dans le Play Console (test interne). Pas besoin de compte de service.
  # ---------------------------------------------------------------------------
  android-release:
    name: Swap'Îles Android (AAB signé)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - swapiles_keystore
      vars:
        PACKAGE_NAME: "com.swapiles.app"
      node: 20
    scripts:
      - name: Utiliser JDK 21 (requis par Capacitor 7)
        script: |
          echo "JDK disponibles :"; /usr/libexec/java_home -V 2>&1 || true
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          echo "JAVA_HOME=$JAVA_HOME" >> $CM_ENV
          "$JAVA_HOME/bin/java" -version
      - name: Installer les dépendances
        script: |
          cd mobile
          npm install
      - name: Générer le projet Android + icônes
        script: |
          cd mobile
          npx cap add android || true
          npx @capacitor/assets generate --android --assetPath resources || true
          npx cap sync android
      - name: Configurer Firebase (notifications push)
        script: |
          cd mobile
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/build.gradle'); g = p.read_text()
          if 'com.google.gms:google-services' not in g:
              g = re.sub(r"(classpath 'com\.android\.tools\.build:gradle[^\n]*\n)",
                         r"\1        classpath 'com.google.gms:google-services:4.4.2'\n", g, count=1)
              p.write_text(g)
          p = pathlib.Path('android/app/build.gradle'); a = p.read_text()
          if 'com.google.gms.google-services' not in a:
              a = a.rstrip() + "\napply plugin: 'com.google.gms.google-services'\n"
              p.write_text(a)
          print('Firebase branché (google-services)')
          PY
          else
            echo "google-services.json absent : build sans push"
          fi
      - name: Cibler l'API 36 (exigence Google Play)
        script: |
          cd mobile
          yes | sdkmanager "platforms;android-36" >/dev/null 2>&1 || true
          python3 scripts/target-sdk-36.py
      - name: Injecter signature + versionCode unique dans build.gradle
        script: |
          cd mobile
          # versionCode unique et croissant (numéro de build Codemagic, sinon timestamp)
          export VC="${PROJECT_BUILD_NUMBER:-$(date +%s)}"
          echo "versionCode = $VC"
          python3 - <<'PY'
          import os, re, pathlib
          vc = os.environ["VC"]
          p = pathlib.Path('android/app/build.gradle')
          g = p.read_text()
          if 'signingConfigs' not in g:
              block = (
                  '    signingConfigs {\n'
                  '        release {\n'
                  '            storeFile file(System.getenv("CM_KEYSTORE_PATH"))\n'
                  '            storePassword System.getenv("CM_KEYSTORE_PASSWORD")\n'
                  '            keyAlias System.getenv("CM_KEY_ALIAS")\n'
                  '            keyPassword System.getenv("CM_KEY_PASSWORD")\n'
                  '        }\n'
                  '    }\n'
              )
              g = g.replace('android {\n', 'android {\n' + block, 1)
              g = g.replace(
                  'release {\n            minifyEnabled',
                  'release {\n            signingConfig signingConfigs.release\n            minifyEnabled',
                  1,
              )
          # versionCode unique
          g = re.sub(r'versionCode\s+\d+', 'versionCode ' + vc, g, count=1)
          p.write_text(g)
          print("build.gradle patché, versionCode =", vc)
          PY
      - name: Build AAB release
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          "$JAVA_HOME/bin/java" -version
          cd mobile/android
          ./gradlew bundleRelease -Dorg.gradle.java.home="$JAVA_HOME"
    artifacts:
      - mobile/android/app/build/outputs/**/*.aab
    # Pas de publication auto pour l'instant : tu télécharges l'AAB et tu
    # l'uploades toi-même dans le Play Console (test interne). L'automatisation
    # (publishing: google_play) s'ajoutera avec le compte de service Play.
