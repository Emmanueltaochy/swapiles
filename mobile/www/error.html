<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swap'Îles</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #0f766e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card { max-width: 340px; }
    .palm { font-size: 56px; line-height: 1; margin-bottom: 12px; }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 800; }
    p { font-size: 15px; line-height: 1.5; opacity: .92; margin: 0 0 24px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #fff; color: #0f766e; font-weight: 800; font-size: 16px;
      border-radius: 9999px; padding: 14px 28px; width: 100%;
    }
    button:active { transform: scale(.98); }
    .hint { margin-top: 16px; font-size: 13px; opacity: .8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="palm" aria-hidden="true">🌴</div>
    <h1>Connexion impossible</h1>
    <p>Impossible de charger Swap'Îles pour le moment. Vérifiez votre connexion internet, puis réessayez.</p>
    <button id="retry" type="button">Réessayer</button>
    <p class="hint">Swap'Îles — la seconde main dans les îles</p>
  </div>

  <script>
    function retry() {
      // Recharge le site en direct.
      window.location.href = 'https://swapiles.com';
    }
    document.getElementById('retry').addEventListener('click', retry);
    // Nouvelle tentative automatique dès que la connexion revient.
    window.addEventListener('online', retry);
  </script>
</body>
</html>
